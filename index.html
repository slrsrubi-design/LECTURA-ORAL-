<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lectura Oral</title>
<style>body{font-family:Arial;background:#f4f7fb;color:#172033;margin:0}.w{max-width:850px;margin:auto;padding:20px}.c{background:white;padding:22px;border-radius:15px;margin:15px 0;box-shadow:0 3px 14px #0001}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 12px;border:1px solid #ccd3df;border-radius:9px;font-size:16px}button{padding:12px 16px;border:0;border-radius:9px;font-weight:bold;margin:4px;cursor:pointer}.b{background:#1769d2;color:white}.r{background:#c93434;color:white}.timer{font-size:48px;font-weight:bold;text-align:center}.result{background:#f5f7fb;padding:15px;border-radius:10px;line-height:1.7}</style></head><body><div class="w">
<div class="c"><h1>📖 Evaluación de Lectura Oral</h1><p>Velocidad y calidad lectora · 1.º básico</p></div>
<div class="c"><label>Estudiante</label><input id="nom"><label>Lectura</label><textarea readonly>La maleta — Utiliza la lectura oficial impresa. Si termina antes del minuto, vuelve al título y continúa hasta completar 60 segundos.</textarea></div>
<div class="c"><h2>🎙️ Lectura de 60 segundos</h2><div class="timer" id="t">60</div><button id="test">🎤 Probar micrófono</button><button class="b" id="start">▶ Comenzar</button><button class="r" id="stop" disabled>■ Finalizar</button><p id="status">Chrome solicitará permiso para usar el micrófono.</p><audio id="audio" controls style="display:none;width:100%"></audio></div>
<div class="c"><h2>Resultado</h2><label>Palabras correctas en 1 minuto</label><input id="ppm" type="number" min="0"><label>Calidad predominante</label><select id="cal"><option value="">Seleccionar</option><option value="1">No lector</option><option value="2">Lectura silábica</option><option value="3">Lectura palabra a palabra</option><option value="4">Lectura por unidades cortas</option><option value="5">Lectura fluida</option></select><label>Observaciones</label><textarea id="obs" placeholder="Titubea, se acelera, omite o sustituye palabras..."></textarea><button class="b" id="calc">Calcular resultado</button><div id="res" class="result">Ingresa los datos para obtener el resultado.</div></div></div>
<script>
let stream,rec,chunks=[],timerInt,rem=60;
async function getMic(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});status.innerHTML="✅ Micrófono funcionando";return true}catch(e){status.innerHTML="❌ No se pudo acceder al micrófono. Permite el micrófono para este sitio en Chrome.";return false}}
test.onclick=async()=>{if(await getMic())stream.getTracks().forEach(x=>x.stop())};
start.onclick=async()=>{if(!(await getMic()))return;chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let b=new Blob(chunks,{type:rec.mimeType});audio.src=URL.createObjectURL(b);audio.style.display="block";stream.getTracks().forEach(x=>x.stop())};rec.start();rem=60;t.textContent=rem;start.disabled=true;stop.disabled=false;timerInt=setInterval(()=>{rem--;t.textContent=rem;if(rem<=0)finish()},1000)};
function finish(){clearInterval(timerInt);if(rec&&rec.state!="inactive")rec.stop();start.disabled=false;stop.disabled=true} stop.onclick=finish;
function vel(n){if(n>=56)return["Muy rápido",7];if(n>=47)return["Rápido",6];if(n>=38)return["Medio alto",5];if(n>=29)return["Medio bajo",4];if(n>=22)return["Lento",3];if(n>=5)return["Muy lento",2];return["No lector",1]}
calc.onclick=()=>{let n=Number(ppm.value);if(ppm.value===""){res.textContent="Ingresa las palabras correctas.";return}let v=vel(n),q=cal.options[cal.selectedIndex];res.innerHTML="<b>"+(nom.value||"Estudiante")+"</b><br>Velocidad: <b>"+n+" ppm</b><br>Categoría: <b>"+v[0]+"</b><br>Puntaje velocidad: <b>"+v[1]+"</b><br>Calidad: <b>"+(cal.value?q.text:"Sin seleccionar")+"</b><br>Puntaje calidad: <b>"+(cal.value||"—")+"</b>"};
</script></body></html>
